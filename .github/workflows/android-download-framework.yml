name: Android download framework

on:
  push:
    branches: [ android-download-framework ]
    paths:
      - 'android/**'
      - '.github/workflows/android-download-framework.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-download-framework.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceRestore-android-download-framework-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
