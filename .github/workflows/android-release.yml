name: Android Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override, e.g. 0.1.0.4'
        required: true

permissions:
  contents: write

# Releases choose pseudo versions one at a time so closely spaced commits cannot
# race and attempt to publish the same v0.1.0.N tag.
concurrency:
  group: android-release-series
  cancel-in-progress: false

env:
  DEVELOPMENT_BASE_VERSION: '0.1.0'

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve release and app versions
        shell: bash
        run: |
          git fetch --tags --force

          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_VERSION="$DEVELOPMENT_BASE_VERSION"
            LAST_BUILD="$({
              git tag --list "v${BASE_VERSION}.*" \
                | sed -nE "s/^v${BASE_VERSION//./\\.}\.([0-9]+)$/\\1/p" \
                | sort -n \
                | tail -n 1
            } || true)"

            if [[ -z "$LAST_BUILD" ]]; then
              NEXT_BUILD=1
            else
              NEXT_BUILD=$((LAST_BUILD + 1))
            fi

            RELEASE_VERSION="${BASE_VERSION}.${NEXT_BUILD}"
            echo "Commit-triggered release selected: $RELEASE_VERSION"
          else
            RELEASE_VERSION="${{ inputs.version }}"
          fi

          if [[ "$RELEASE_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.([0-9]+))?$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            PSEUDO_BUILD="${BASH_REMATCH[3]:-0}"
          else
            echo "Version must be x.y.z or x.y.z.N, for example 0.1.0.4"
            exit 1
          fi

          if git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists; refusing to overwrite it."
            exit 1
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PSEUDO_BUILD=$PSEUDO_BUILD" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Release $RELEASE_VERSION -> app versionName $VERSION_NAME, versionCode ${GITHUB_RUN_NUMBER}, source $GITHUB_SHA"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idevicerestore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/idevicerestore-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace assembleRelease

      - name: Prepare Obtainium APK asset
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk iDeviceRestore.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeviceRestore-${{ env.RELEASE_VERSION }}
          path: iDeviceRestore.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: iDeviceRestore.apk
          generate_release_notes: true
          name: iDeviceRestore Android ${{ env.RELEASE_VERSION }}
