name: Android Release

on:
  push:
    branches:
      - master
    paths:
      - android/gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require master release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Android releases must run from master; current ref is $GITHUB_REF"
            exit 1
          fi

      - name: Resolve user-facing release version
        shell: bash
        run: |
          git fetch --tags --force
          RELEASE_VERSION="$(sed -nE 's/^ideviceRestoreVersionName=([^[:space:]]+)$/\1/p' android/gradle.properties | tail -n 1)"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "android/gradle.properties must define ideviceRestoreVersionName as x.y.z"
            exit 1
          fi

          if git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists. Bump ideviceRestoreVersionName before releasing."
            exit 1
          fi

          LAST_REAL_VERSION="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [[ -n "$LAST_REAL_VERSION" ]]; then
            HIGHEST="$(printf '%s\n%s\n' "$LAST_REAL_VERSION" "$RELEASE_VERSION" | sort -V | tail -n 1)"
            if [[ "$HIGHEST" != "$RELEASE_VERSION" || "$RELEASE_VERSION" == "$LAST_REAL_VERSION" ]]; then
              echo "Release version $RELEASE_VERSION must be newer than the latest published semantic release $LAST_REAL_VERSION"
              exit 1
            fi
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "User-facing app version and release tag: $RELEASE_VERSION"

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Verify toolchains
        run: |
          node --version
          npm --version
          java -version
          gradle --version

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idevicerestore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/idevicerestore-release.jks" >> "$GITHUB_ENV"

      - name: Build signed production release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace assembleProductionRelease

      - name: Verify APK version matches release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_path = Path("android/app/build/outputs/apk/production/release/output-metadata.json")
          metadata = json.loads(metadata_path.read_text())
          elements = metadata.get("elements") or []
          if len(elements) != 1:
              raise SystemExit(f"Expected one release APK metadata element, found {len(elements)}")
          actual = str(elements[0].get("versionName", "")).strip()
          expected = os.environ["RELEASE_VERSION"]
          if actual != expected:
              raise SystemExit(f"APK versionName mismatch: expected {expected}, got {actual}")
          print(f"Verified APK user-facing version {actual}")
          PY

      - name: Prepare Obtainium APK asset
        shell: bash
        run: cp android/app/build/outputs/apk/production/release/app-production-release.apk iDeviceRestore.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: iDeviceRestore-${{ env.RELEASE_VERSION }}
          path: iDeviceRestore.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: iDeviceRestore.apk
          generate_release_notes: true
          name: iDeviceRestore Android ${{ env.RELEASE_VERSION }}
