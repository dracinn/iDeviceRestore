name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag version, e.g. 0.1.0.1 (app still displays 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve release and app versions
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ inputs.version }}"
          fi

          # Development releases may add a fourth numeric component so Obtainium
          # sees a newer release while Android still displays the base x.y.z version.
          # Example: v0.1.0.7 -> versionName 0.1.0, release version 0.1.0.7.
          if [[ "$RELEASE_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.([0-9]+))?$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            PSEUDO_BUILD="${BASH_REMATCH[3]:-0}"
          else
            echo "Version must be x.y.z or x.y.z.N, for example 0.1.0.1"
            exit 1
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PSEUDO_BUILD=$PSEUDO_BUILD" >> "$GITHUB_ENV"
          # Android requires versionCode to increase for an APK update. The Actions
          # run number is monotonic even while the visible versionName stays fixed.
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Release $RELEASE_VERSION -> app versionName $VERSION_NAME, versionCode ${GITHUB_RUN_NUMBER}"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idevicerestore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/idevicerestore-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace assembleRelease

      - name: Prepare Obtainium APK asset
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk iDeviceRestore.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeviceRestore-${{ env.RELEASE_VERSION }}
          path: iDeviceRestore.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: iDeviceRestore.apk
          generate_release_notes: true
          name: iDeviceRestore Android ${{ env.RELEASE_VERSION }}
