name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.14.5' }
      - name: Build four asset-driven preview APKs
        run: gradle -p android --no-daemon --stacktrace assembleHomeDebug assembleFirmwareDebug assembleRestoreDebug assembleDiagnosticsDebug
      - name: Verify four preview APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk -path '*/debug/*.apk' -type f | sort)
          printf '%s\n' "${apks[@]}"
          [[ ${#apks[@]} -eq 4 ]]
      - name: Upload preview APKs
        uses: actions/upload-artifact@v7
        with:
          name: iDeviceRestore-android-four-previews
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
