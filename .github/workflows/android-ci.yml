name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Android-impacting changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --no-tags --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- android/ .github/workflows/android-ci.yml .github/workflows/android-release.yml; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 24 LTS
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.5
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Build four complete design iterations
        if: steps.changes.outputs.android == 'true'
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verify full-app APK variants
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          props = {}
          for line in Path('android/gradle.properties').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          base_version = props['ideviceRestoreVersionName']
          m = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', base_version)
          if not m:
              raise SystemExit(f'Invalid semantic version {base_version!r}')
          major, minor, patch = map(int, m.groups())
          expected_code = major * 1_000_000 + minor * 1_000 + patch
          expected_flavors = {'reference', 'compact', 'comfort', 'minimal'}
          found = {}
          for metadata_path in Path('android/app/build/outputs/apk').glob('*/debug/output-metadata.json'):
              flavor = metadata_path.parent.parent.name
              data = json.loads(metadata_path.read_text())
              elements = data.get('elements') or []
              if len(elements) != 1:
                  raise SystemExit(f'{metadata_path}: expected one APK element')
              element = elements[0]
              found[flavor] = {
                  'applicationId': data.get('applicationId'),
                  'versionName': str(element.get('versionName', '')),
                  'versionCode': int(element.get('versionCode', -1)),
                  'apk': str(metadata_path.parent / element.get('outputFile', '')),
              }
          if set(found) != expected_flavors:
              raise SystemExit(f'Expected flavors {sorted(expected_flavors)}, found {sorted(found)}')
          for flavor in sorted(expected_flavors):
              item = found[flavor]
              if item['applicationId'] != 'com.idevicerestore.android':
                  raise SystemExit(f'{flavor}: package mismatch {item["applicationId"]!r}')
              if item['versionName'] != f'{base_version}-{flavor}':
                  raise SystemExit(f'{flavor}: versionName mismatch {item["versionName"]!r}')
              if item['versionCode'] != expected_code:
                  raise SystemExit(f'{flavor}: versionCode mismatch {item["versionCode"]}')
              if not Path(item['apk']).is_file():
                  raise SystemExit(f'{flavor}: missing APK {item["apk"]}')
              print(f'{flavor}: {item["applicationId"]} {item["versionName"]} -> {item["apk"]}')
          PY

      - name: Enable KVM access
        if: steps.changes.outputs.android == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test all four APKs on Android 14 ARM64
        if: steps.changes.outputs.android == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: >-
            bash -lc 'set -eu; for flavor in reference compact comfort minimal; do apk="android/app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"; echo "Testing ${flavor} -> ${apk}"; adb install -r "${apk}"; adb logcat -c; adb shell am force-stop com.idevicerestore.android; adb shell am start -W -n com.idevicerestore.android/.MainActivity; sleep 5; if ! adb shell pidof com.idevicerestore.android >/dev/null; then echo "Startup failure for ${flavor}"; adb logcat -d -t 300; exit 1; fi; if adb logcat -d -t 300 | grep -q "FATAL EXCEPTION: main"; then echo "Main-thread crash detected for ${flavor}"; adb logcat -d -t 300; exit 1; fi; adb shell am force-stop com.idevicerestore.android; done'

      - name: Upload four full-app design APKs
        if: steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: iDeviceRestore-four-full-app-designs-smoke-tested
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Documentation-only PR
        if: steps.changes.outputs.android != 'true'
        run: echo "No Android-impacting changes; build passes without compiling APKs."
