name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Android-impacting changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --no-tags --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- android/ .github/workflows/android-ci.yml .github/workflows/android-release.yml; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 24 LTS
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.5
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Build mockup-first debug APK
        if: steps.changes.outputs.android == 'true'
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verify debug APK metadata
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          props = {}
          for line in Path('android/gradle.properties').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          expected_name = props['ideviceRestoreVersionName']
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', expected_name)
          if not match:
              raise SystemExit(f'Invalid semantic version {expected_name!r}')
          major, minor, patch = map(int, match.groups())
          expected_code = major * 1_000_000 + minor * 1_000 + patch

          metadata_path = Path('android/app/build/outputs/apk/debug/output-metadata.json')
          data = json.loads(metadata_path.read_text())
          elements = data.get('elements') or []
          if len(elements) != 1:
              raise SystemExit(f'Expected one debug APK element, found {len(elements)}')
          element = elements[0]
          if data.get('applicationId') != 'com.idevicerestore.android':
              raise SystemExit(f'Package mismatch: {data.get("applicationId")!r}')
          if str(element.get('versionName', '')).strip() != expected_name:
              raise SystemExit(f'Version mismatch: {element.get("versionName")!r}')
          if int(element.get('versionCode', -1)) != expected_code:
              raise SystemExit(f'Version code mismatch: {element.get("versionCode")!r}')
          apk = metadata_path.parent / element.get('outputFile', '')
          if not apk.is_file():
              raise SystemExit(f'Missing debug APK: {apk}')
          print(f'Verified {data.get("applicationId")} {expected_name} -> {apk}')
          PY

      - name: Build release compatibility APK
        if: steps.changes.outputs.android == 'true'
        run: gradle -p android --no-daemon --stacktrace assembleRelease

      - name: Verify release compatibility
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          props = {}
          for line in Path('android/gradle.properties').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          expected = props['ideviceRestoreVersionName']
          metadata_path = Path('android/app/build/outputs/apk/release/output-metadata.json')
          data = json.loads(metadata_path.read_text())
          elements = data.get('elements') or []
          if len(elements) != 1:
              raise SystemExit(f'Expected one release APK element, found {len(elements)}')
          element = elements[0]
          if str(element.get('versionName', '')).strip() != expected:
              raise SystemExit(f'Release version mismatch: expected {expected!r}, got {element.get("versionName")!r}')
          apk = metadata_path.parent / element.get('outputFile', '')
          if not apk.is_file():
              raise SystemExit(f'Missing release APK: {apk}')
          print(f'Release compatible: {apk}')
          PY

      - name: Upload mockup-first APK
        if: steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: iDeviceRestore-mockup-first
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Documentation-only PR
        if: steps.changes.outputs.android != 'true'
        run: echo "No Android-impacting changes; build passes without compiling APKs."
